<!DOCTYPE html>
<html lang="pt-BR" data-theme="{{ d.tema or 'dark' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estação Meteorológica</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">

    <header class="topo">
      <h1>Estação Meteorológica</h1>
    </header>

    <div class="layout">

      <section class="coluna">
        <div class="card principal">
          <h2 id="local">{{ d.local }}</h2>
          <p id="temp-atual" class="temperatura">{{ d.temperatura }}</p>
          <div class="icone">
            <span id="icone-temp" class="emoji">{{ d.icone }}</span>
            <span id="desc-temp" class="descricao">{{ d.descricao }}</span>
          </div>
        </div>

        <div class="tiles">
          <div class="tile escuro">
            <span class="tile-titulo">Pressão</span>
            <span id="pressao" class="tile-valor">{{ d.pressao }}</span>
          </div>
          <div class="tile claro">
            <span class="tile-titulo">Umidade</span>
            <span id="umidade" class="tile-valor">{{ d.umidade }}</span>
          </div>
          <div class="tile escuro">
            <span class="tile-titulo">Hora</span>
            <span id="hora" class="tile-valor">--:--</span>
          </div>
          <div class="tile claro">
            <span class="tile-titulo">Luz</span>
            <span id="luz" class="tile-valor">{{ d.luz }}</span>
          </div>
        </div>
      </section>

      <section class="coluna">
        <div class="card painel">
          <div class="leituras">
            {% for l in d.ultimos %}
            <div class="leitura">
              <div class="leitura-item">
                <span class="leitura-titulo">Temp</span>
                <span id="ultimo-{{ loop.index0 }}-temperatura" class="leitura-valor">{{ l.temperatura }}</span>
              </div>
              <div class="leitura-item">
                <span class="leitura-titulo">Pressão</span>
                <span id="ultimo-{{ loop.index0 }}-pressao" class="leitura-valor">{{ l.pressao }}</span>
              </div>
              <div class="leitura-item">
                <span class="leitura-titulo">Umidade</span>
                <span id="ultimo-{{ loop.index0 }}-umidade" class="leitura-valor">{{ l.umidade }}</span>
              </div>
            </div>
            {% endfor %}
          </div>
        </div>

        <div id="alerta" class="card alerta {{ d.alerta_status }}">
          <span class="bolinha"></span>
          <span id="alerta-texto">{{ d.alerta_texto }}</span>
        </div>
      </section>

    </div>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
